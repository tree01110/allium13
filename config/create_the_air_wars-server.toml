[camera_monitor]
	#Maximum camera monitor refresh rate in frames per second.
	#Recommended range: 4-12
	# Default: 4
	# Range: 1 ~ 20
	feed_fps = 8
	#Camera monitor render resolution. Supported values: 64, 96, 128, 192, 256, 384, 512, 768, 1024
	# Default: 256
	# Range: 64 ~ 1024
	feed_resolution = 512
	#Extra chunk radius loaded and rendered around every active camera.
	#These chunks are added to the player's normal chunks; they do not replace them.
	#Default: 6, supported range: 1-16. High values are expensive.
	# Default: 6
	# Range: 1 ~ 16
	feed_view_distance = 6
